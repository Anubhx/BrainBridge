# Run n8n locally on your Windows laptop via Docker Desktop.
#
# Usage (from PowerShell, in this folder):
#   docker compose up -d
#   -> open http://localhost:5678
#
# Data (workflows, credentials) persists in the named volume `n8n_data`
# across restarts, as long as you don't `docker compose down -v`.

version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: brainbridge-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=Asia/Kolkata
      # Basic auth so the local UI isn't wide open, even on your own machine.
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
